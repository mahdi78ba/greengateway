# config/tenants.yaml
# MAP form, keyed by tenant id. src/config.js does
#   for (const [id, t] of Object.entries(doc.tenants))
# so a list form ("- id: ...") BREAKS the loader. Do not convert this to a list.
#
# Optional blocks: `cache:` (Phase 3) and `limits:` (Phase 4). demo-nobudget
# deliberately has neither, which proves that a tenant without them runs on the
# defaults and keeps working.

tenants:
  treetracker-admin:
    key: gg_live_local_dev_key
    budget_usd: 1.00
    allow_models: [z-ai/glm-5.2:free, google/gemma-4-31b-it:free]
    fallbacks: [google/gemma-4-31b-it:free]
    policy: { allow_fallbacks: true, data_collection: allow }
    routing: { maxAttempts: 3, slo: { timeoutMs: 20000 } }
    # Phase 3. Every key is optional; anything omitted falls back to DEFAULTS
    # in src/cache/index.js.
    cache:
      enabled: true              # master switch for this tenant
      ttlSeconds: 86400          # 24h. 0 = DO NOT CACHE. -1 = never expire.
      volatileTtlSeconds: 60     # prompts with today/now/price/latest/... words
      maxEntries: 500            # per-tenant cap (in-memory store only; Redis uses GGW_CACHE_MAX_ENTRIES)
      maxBytes: 8388608          # per-tenant cap, 8 MB (in-memory store only; Redis uses GGW_CACHE_MAX_BYTES)
      semantic: true             # tier 1 (near-duplicate) on
      threshold: 0.85            # cosine score required for a semantic hit
      similarity: lexical        # the only backend in the core path; anything else
                                 # throws and is logged, never silently downgraded
      semanticMaxTemperature: 0.3  # above this: exact tier only. A request that
                                 # omits `temperature` is treated as 0 (cacheable).
      maxSemanticCandidates: 200 # per-bucket scan cap (bounded lookup latency)
      maxResponseChars: 32000    # bodies larger than this are never memoized
      minContentTokens: 2        # fewer surviving content tokens: exact tier only
    # Phase 4. Optional; omit the whole block to get rpm 20 / rpd 50.
    limits:
      enabled: true
      rpm: 20            # OpenRouter free tier: ~20 requests/minute (per ACCOUNT)
      rpd: 50            # ~50/day until the account has ever bought $10 of credit

  demo-nobudget:
    key: gg_live_nobudget
    budget_usd: 0
    allow_models: [z-ai/glm-5.2:free]
    policy: { allow_fallbacks: true, data_collection: allow }
    # No `cache:` or `limits:` block on purpose: defaults apply. It never reaches
    # either in practice, because budget_usd 0 makes the 402 fire first, which is
    # exactly what the smoke test asserts.
