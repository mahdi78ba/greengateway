{{- if and (not .Values.mock.enabled) (not .Values.openrouter.apiKey) }}
{{- fail "mock.enabled is false, so openrouter.apiKey is required (--set openrouter.apiKey=sk-or-...)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "greengateway.fullname" . }}
  labels: {{- include "greengateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  # With the mock upstream any value works; the mock never checks it.
  OPENROUTER_API_KEY: {{ .Values.mock.enabled | ternary "sk-mock" .Values.openrouter.apiKey | quote }}
