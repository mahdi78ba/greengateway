{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "greengateway.fullname" . }}
  labels: {{- include "greengateway.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "greengateway.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  # Lab-friendly: scale down after 60 s of calm instead of the 5-minute default,
  # so a k6 run shows the whole up-and-down cycle in a few minutes.
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
{{- end }}
