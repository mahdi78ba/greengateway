apiVersion: v1
kind: Service
metadata:
  name: {{ include "greengateway.fullname" . }}
  labels: {{- include "greengateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
  selector: {{- include "greengateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
