# Dependabot keeps every pinned input current: the npm lockfile, the SHA-pinned
# GitHub Actions (it rewrites the "# vX.Y.Z" comment too), the digest-pinned
# base images in the Dockerfile, and the image tags in docker-compose.yml.
# Minor and patch bumps arrive grouped, one PR per ecosystem per week; a major
# bump always arrives alone so its changelog gets read.
#
# NOT covered (bump by hand, together with the matching npm script): the tool
# images run from `run:` blocks in ci.yml and from package.json scripts
# (hadolint, actionlint, gitleaks, trivy, syft).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The two FROM lines of the Dockerfile (tag + digest). The Node MAJOR is a
  # deliberate LTS choice (24 until 2028), so majors are not proposed.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  # redis, prometheus, alertmanager and grafana in docker-compose.yml.
  # greengateway:dev is built locally, not pulled, so it is not looked up.
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: greengateway
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
